services:
  - type: web
    name: multi-agent-research-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # --proxy-headers: rate limits must see the real client IP, not Render's proxy.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://mutli-agent-orchestration.vercel.app
      - key: TAVILY_API_KEY
        sync: false
